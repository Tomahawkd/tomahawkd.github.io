name: Build content with RhineLabUI and deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RHINELAB_CONTENT_DIR: ${{ github.workspace }}
    defaults:
      run:
        working-directory: _engine
    steps:
      - uses: actions/checkout@v4
      - name: Check out the UI and build engine
        uses: actions/checkout@v4
        with:
          repository: Tomahawkd/RhineLabUI
          # Updated only when adopting a new reviewed UI version.
          ref: 0e761e2f1a783da21051d61aa1f43e5ce33f1221
          path: _engine
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _engine/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _engine/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
